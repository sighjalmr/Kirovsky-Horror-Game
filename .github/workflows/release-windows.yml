# Builds the Windows game (one Kirovsky.exe with the game packed inside)
# and attaches it, zipped, to a GitHub Release.
#
# Start it by pushing a tag that begins with "v" (for example v0.9),
# or from the Actions tab with "Run workflow" once this file is on main.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and Windows export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz 'templates/windows_*' 'templates/version.txt' -d "$dir"
          rm -f godot.zip templates.tpz
          ls -la "$dir"

      - name: Import assets
        run: godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          mkdir -p export
          godot --headless --path . --export-release Windows export/Kirovsky.exe
          ls -la export
          test -s export/Kirovsky.exe

      - name: Zip
        run: |
          cd export
          zip -9 Kirovsky-windows.zip Kirovsky.exe
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes="Как запустить: скачайте Kirovsky-windows.zip ниже, распакуйте и откройте Kirovsky.exe. Если Windows покажет синее окно «Система Windows защитила ваш компьютер», нажмите «Подробнее» и «Выполнить в любом случае»."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" export/Kirovsky-windows.zip --clobber
          else
            gh release create "$TAG" export/Kirovsky-windows.zip \
              --target "$GITHUB_SHA" --title "Кировский: Закрытие — $TAG" --notes "$notes"
          fi
